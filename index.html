const MarkdownText = ({ text }) => {
  const lines = text.split("\n");
  return (
    <div className="space-y-1 text-sm leading-relaxed">
      {lines.map((line, i) => {
        if (!line.trim()) return <div key={i} className="h-1" />;
        if (line.startsWith("**") && line.endsWith("**")) return <p key={i} className="font-semibold text-slate-800">{line.replace(/\*\*/g, "")}</p>;
        const bold = line.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
        if (line.startsWith("•")) return <p key={i} className="pl-3 text-slate-700" dangerouslySetInnerHTML={{ __html: bold }} />;
        return <p key={i} className="text-slate-700" dangerouslySetInnerHTML={{ __html: bold }} />;
      })}
    </div>
  );
};

const QuizCard = ({ topicId, onEmailEscalate }) => {
  const quiz = QUIZ_BANK[topicId];
  const [selections, setSelections] = useState({});
  const [submitted, setSubmitted] = useState(false);
  const [score, setScore] = useState(null);
  if (!quiz) return null;
  const handleSelect = (qIdx, oIdx) => { if (!submitted) setSelections(prev => ({ ...prev, [qIdx]: oIdx })); };
  const handleSubmit = () => { if (Object.keys(selections).length < quiz.questions.length) return; let c = 0; quiz.questions.forEach((q, i) => { if (selections[i] === q.answer) c++; }); setScore(c); setSubmitted(true); };
  const handleReset = () => { setSelections({}); setSubmitted(false); setScore(null); };

  return (
    <div className="bg-white rounded-xl border border-slate-200 overflow-hidden mt-2">
      <div className="bg-gradient-to-r from-indigo-500 to-violet-600 px-4 py-2.5"><span className="text-white text-sm font-semibold">📝 Quiz: {quiz.topic}</span></div>
      <div className="p-4 space-y-4">
        {quiz.questions.map((q, qIdx) => (
          <div key={qIdx} className="space-y-1.5">
            <p className="text-sm font-medium text-slate-800">Q{qIdx+1}. {q.q}</p>
            {q.options.map((opt, oIdx) => {
              let cls = "quiz-option w-full text-left text-xs px-3 py-2 rounded-lg border cursor-pointer ";
              if (!submitted) cls += selections[qIdx] === oIdx ? "bg-indigo-50 border-indigo-400 text-indigo-700 font-medium" : "bg-white border-slate-200 text-slate-700";
              else if (oIdx === q.answer) cls += "bg-emerald-50 border-emerald-400 text-emerald-800 font-medium submitted";
              else if (oIdx === selections[qIdx]) cls += "bg-red-50 border-red-300 text-red-700 submitted";
              else cls += "bg-white border-slate-100 text-slate-400 submitted";
              return <button key={oIdx} className={cls} onClick={() => handleSelect(qIdx, oIdx)}><span className="font-mono mr-2">{String.fromCharCode(65+oIdx)}.</span>{opt}{submitted && oIdx === q.answer && " ✓"}{submitted && oIdx === selections[qIdx] && selections[qIdx] !== q.answer && " ✗"}</button>;
            })}
            {submitted && <p className="text-xs px-3 py-2 rounded-lg bg-blue-50 text-blue-700">💬 {q.explanation}</p>}
          </div>
        ))}
      </div>
      <div className="px-4 pb-4">
        {!submitted ? <button onClick={handleSubmit} disabled={Object.keys(selections).length < quiz.questions.length} className="w-full py-2 rounded-xl text-sm font-semibold bg-gradient-to-r from-indigo-600 to-violet-600 text-white disabled:opacity-40">Submit ({Object.keys(selections).length}/3)</button>
        : <div className="space-y-2"><div className={`text-center py-2 rounded-xl text-sm font-semibold ${score===3?"bg-emerald-100 text-emerald-700":score>=2?"bg-blue-100 text-blue-700":"bg-red-100 text-red-700"}`}>Score: {score}/3</div><div className="flex gap-2"><button onClick={handleReset} className="flex-1 py-2 rounded-xl text-xs font-semibold border border-slate-200 text-slate-600 hover:bg-slate-50">↺ Retry</button>{score<3&&<button onClick={()=>onEmailEscalate(quiz.topic,quiz.course)} className="flex-1 py-2 rounded-xl text-xs font-semibold bg-amber-50 border border-amber-200 text-amber-700">✉️ Ask Prof</button>}</div></div>}
      </div>
    </div>
  );
};

// CHAT PANEL (persistent right side)

const ChatPanel = ({ onEmailEscalate }) => {
  const [messages, setMessages] = useState([
    { id: 1, role: "ai", type: "text", text: "Hi Alex! 👋 I'm your **StudySync AI** copilot.\n\n• **Explain concepts** — highlight text in Lecture Notes\n• **Practice quizzes** — test your weak topics\n• **Email professors** — one-click escalation\n\nAsk me anything!" },
  ]);
  const [input, setInput] = useState("");
  const [isTyping, setIsTyping] = useState(false);
  const endRef = useRef(null);
  useEffect(() => { endRef.current?.scrollIntoView({ behavior: "smooth" }); }, [messages]);

  const add = (msg) => setMessages(p => [...p, { id: Date.now()+Math.random(), ...msg }]);
  const typing = (cb, d=900) => { setIsTyping(true); setTimeout(() => { setIsTyping(false); cb(); }, d); };

  const handleExplain = useCallback((text, topic) => {
    add({ role: "user", type: "text", text: `Explain: "${text.substring(0,50)}${text.length>50?"...":""}"` });
    typing(() => { add({ role: "ai", type: "text", text: AI_RESPONSES.explain(topic, text) }); add({ role: "ai", type: "escalate-prompt", topic, course: "CG1111A" }); }, 1000);
  }, []);

  const handleQuizRequest = useCallback((topicId, topicName) => {
    add({ role: "user", type: "text", text: `Quiz me on: ${topicName}` });
    typing(() => { add({ role: "ai", type: "text", text: AI_RESPONSES.quiz_intro(topicName) }); add({ role: "ai", type: "quiz", topicId }); }, 800);
  }, []);

  const handleSend = () => {
    const t = input.trim(); if (!t) return;
    add({ role: "user", type: "text", text: t }); setInput("");
    const lower = t.toLowerCase();
    typing(() => {
      if (lower.includes("quiz") || lower.includes("practice")) { add({ role: "ai", type: "text", text: "Which topic? Pick one:" }); add({ role: "ai", type: "quiz-picker" }); }
      else if (lower.includes("explain") || lower.includes("what is")) { add({ role: "ai", type: "text", text: "Highlight text in **Lecture Notes** and click **Explain This**, or go to a module's notes page!" }); }
      else if (lower.includes("email") || lower.includes("prof")) { add({ role: "ai", type: "escalate-prompt", topic: "State Machines", course: "CG1111A" }); }
      else { add({ role: "ai", type: "text", text: `I can help with that! Try:\n• Highlighting lecture notes → "Explain This"\n• Opening a module → Past Tests to see weak chapters\n• Asking me: *"Quiz me on State Machines"*` }); }
    });
  };

  window._studysyncExplain = handleExplain;

  return (
    <div className="flex flex-col h-full bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
      <div className="flex items-center gap-3 px-4 py-3 border-b border-slate-100 bg-gradient-to-r from-violet-50 to-indigo-50 flex-shrink-0">

        </div>
        <div><p className="text-sm font-semibold text-slate-900">StudySync AI</p><p className="text-xs text-slate-400">Always online</p></div>
      </div>
      <div className="flex-1 overflow-y-auto scrollbar-thin p-4 space-y-3">
        {messages.map(msg => (
          <div key={msg.id} className={`flex ${msg.role==="user"?"justify-end":"justify-start"}`}>
            {msg.role === "ai" && (
              <div className="flex flex-col gap-1 max-w-[88%]">
                {msg.type === "text" && <div className="chat-bubble-ai rounded-2xl rounded-tl-sm px-4 py-3 border border-blue-100"><MarkdownText text={msg.text} /></div>}
                {msg.type === "escalate-prompt" && (
                  <div className="bg-amber-50 border border-amber-200 rounded-2xl rounded-tl-sm px-4 py-3">
                    <p className="text-xs text-amber-700 font-medium mb-2">Need more help? Escalate to your professor.</p>

// PAST TESTS VIEW — Shows scores + full question breakdown with answers
// ═══════════════════════════════════════════════════════════════════════════════

const PastTestsView = ({ mod, onViewNotes, onOpenPDF }) => {
  const [expandedTest, setExpandedTest] = useState(null);

  // Compute chapter weakness from all wrong answers across tests
  const chapterWeakness = {};
  mod.pastTests.forEach(test => {
    test.questions.forEach(q => {
      if (!chapterWeakness[q.chapter]) chapterWeakness[q.chapter] = { total: 0, lost: 0, wrong: 0, topics: [] };
      chapterWeakness[q.chapter].total += q.maxMarks;
      if (!q.correct) {
        chapterWeakness[q.chapter].lost += (q.maxMarks - q.scored);
        chapterWeakness[q.chapter].wrong++;
        if (!chapterWeakness[q.chapter].topics.includes(q.topic)) chapterWeakness[q.chapter].topics.push(q.topic);
      }
    });
  });

  const sortedWeakChapters = Object.entries(chapterWeakness)
    .filter(([_, data]) => data.wrong > 0)
    .sort((a, b) => b[1].lost - a[1].lost);

  return (
    <div className="space-y-5">
      {/* Chapter Weakness Analysis */}
      {sortedWeakChapters.length > 0 && (
        <div className="bg-red-50 border border-red-200 rounded-2xl p-5">
          <h3 className="text-sm font-semibold text-red-900 flex items-center gap-2 mb-3">⚠️ Chapter Weakness Analysis <Badge color="red">{sortedWeakChapters.length} weak chapters</Badge></h3>
          <p className="text-xs text-red-700 mb-4">Based on incorrect answers across all tests. Chapters are ranked by total marks lost.</p>
          <div className="space-y-3">
            {sortedWeakChapters.map(([chId, data]) => {
              const ch = mod.chapters.find(c => c.id === chId);
              const pct = Math.round((1 - data.lost / data.total) * 100);
              return (
                <div key={chId} className="bg-white rounded-xl border border-red-100 p-4">
                  <div className="flex items-start justify-between mb-2">
                    <div>
                      <p className="text-sm font-semibold text-slate-800">Ch {ch?.num}: {ch?.title}</p>
                      <p className="text-xs text-red-600 mt-0.5">{data.wrong} question{data.wrong > 1 ? "s" : ""} wrong · {data.lost} marks lost</p>
                    </div>
                    <div className="text-right">
                      <p className={`text-sm font-bold ${pct < 50 ? "text-red-600" : "text-yellow-600"}`}>{pct}%</p>
                      <p className="text-xs text-slate-400">retention</p>
                    </div>
                  </div>
                  <ScoreBar score={pct} height="h-2" />
                  <div className="mt-2 flex flex-wrap gap-1">
                    {data.topics.map(t => <span key={t} className="text-xs bg-red-100 text-red-700 px-2 py-0.5 rounded-full">{t}</span>)}
                  </div>
                  <button onClick={() => onViewNotes(chId)}
                    className="mt-3 w-full py-2 rounded-xl text-xs font-semibold bg-violet-50 border border-violet-200 text-violet-700 hover:bg-violet-100 transition-colors flex items-center justify-center gap-1.5">
                    📖 View Lecture Notes for this Chapter
                  </button>
                </div>
              );
            })}
          </div>
        </div>
      )}

      {/* Individual Tests */}
      <div className="space-y-4">
        <h3 className="text-sm font-semibold text-slate-900">📋 All Tests & Exams</h3>
        {mod.pastTests.map(test => {
          const pct = Math.round(test.totalScore / test.maxScore * 100);
          const isExpanded = expandedTest === test.id;
          return (
            <div key={test.id} className="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
              <button onClick={() => setExpandedTest(isExpanded ? null : test.id)}
                className="w-full flex items-center gap-4 p-5 text-left hover:bg-slate-50 transition-colors">
                <div className={`w-12 h-12 rounded-xl flex items-center justify-center text-white font-bold text-sm ${pct >= 70 ? "bg-emerald-500" : pct >= 50 ? "bg-yellow-500" : "bg-red-500"}`}>{pct}%</div>
                <div className="flex-1">
                  <p className="text-sm font-semibold text-slate-900">{test.title}</p>
                  <p className="text-xs text-slate-500">{new Date(test.date).toLocaleDateString("en-GB", {day:"numeric",month:"short",year:"numeric"})} · {test.duration} · {test.totalScore}/{test.maxScore} marks</p>
                </div>
                <div className="flex items-center gap-2">
                  <Badge color={pct >= 70 ? "green" : pct >= 50 ? "orange" : "red"}>{test.questions.filter(q=>!q.correct).length} wrong</Badge>
                  <svg className={`w-5 h-5 text-slate-400 transition-transform ${isExpanded ? "rotate-180" : ""}`} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}><path strokeLinecap="round" strokeLinejoin="round" d="M19 9l-7 7-7-7"/></svg>
                </div>
              </button>
              {isExpanded && (
                <div className="border-t border-slate-100 p-5 space-y-4">
                  {test.questions.map(q => {
                    const ch = mod.chapters.find(c => c.id === q.chapter);
                    return (
                      <div key={q.num} className={`rounded-xl border overflow-hidden ${q.correct ? "border-emerald-200" : "border-red-200"}`}>
                        {/* Question header */}
                        <div className={`flex items-center gap-3 p-4 ${q.correct ? "bg-emerald-50" : "bg-red-50"}`}>
                          <span className={`w-8 h-8 rounded-lg flex items-center justify-center text-xs font-bold flex-shrink-0 ${q.correct ? "bg-emerald-200 text-emerald-800" : "bg-red-200 text-red-800"}`}>{q.correct ? "✓" : "✗"}</span>
                          <div className="flex-1 min-w-0">
                            <p className="text-sm font-semibold text-slate-800">Q{q.num}: {q.topic}</p>
                            <p className="text-xs text-slate-500">Ch {ch?.num}: {ch?.title} · {q.scored}/{q.maxMarks} marks</p>
                          </div>
                          <div className="text-right flex-shrink-0">
                            <p className={`text-lg font-bold ${q.correct ? "text-emerald-700" : "text-red-700"}`}>{q.scored}/{q.maxMarks}</p>
                          </div>
                        </div>
                        {/* Question details */}
                        <div className="p-4 bg-white space-y-3">
                          {/* Question text */}
                          <div>
                            <p className="text-xs font-semibold text-slate-500 uppercase tracking-wide mb-1">Question</p>
                            <p className="text-sm text-slate-700 leading-relaxed bg-slate-50 rounded-lg p-3 border border-slate-100">{q.questionText}</p>
                          </div>
                          {/* Student's answer */}
                          <div>
                            <p className="text-xs font-semibold text-slate-500 uppercase tracking-wide mb-1">Your Answer</p>
                            <div className={`text-sm leading-relaxed rounded-lg p-3 border ${q.correct ? "bg-emerald-50 border-emerald-200 text-emerald-800" : "bg-red-50 border-red-200 text-red-800"}`}>
                              {q.studentAnswer}
                            </div>
                          </div>
                          {/* Correct answer (shown only if wrong) */}
                          {!q.correct && (
                            <div>
                              <p className="text-xs font-semibold text-emerald-600 uppercase tracking-wide mb-1">✓ Correct Answer</p>
                              <div className="text-sm leading-relaxed rounded-lg p-3 border bg-emerald-50 border-emerald-200 text-emerald-800">
                                {q.correctAnswer}
                              </div>
                            </div>
                          )}
                          {/* Jump to notes button for wrong answers */}
                          {!q.correct && (
                            <button onClick={() => onOpenPDF(mod.pdfFile, `${mod.code} — Ch ${ch?.num}: ${ch?.title}`, ch?.pdfPage || 1)}
                              className="w-full mt-2 flex items-center justify-center gap-2 py-2.5 rounded-xl text-xs font-semibold bg-gradient-to-r from-violet-50 to-indigo-50 border border-violet-200 text-violet-700 hover:from-violet-100 hover:to-indigo-100 transition-all">
                              <svg className="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}><path strokeLinecap="round" strokeLinejoin="round" d="M13 7l5 5m0 0l-5 5m5-5H6"/></svg>
                              Jump to Topic Notes — Ch {ch?.num}: {ch?.title} (p.{ch?.pdfPage})
                            </button>
                          )}
                        </div>
                      </div>
                    );
                  })}
                </div>
              )}
            </div>
          );
        })}
      </div>
    </div>
  );
};

// LECTURE NOTES VIEW — With PDF viewer integration
// ═══════════════════════════════════════════════════════════════════════════════

const LectureNotesView = ({ mod, highlightChapter, onClearHighlight, onOpenPDF }) => {
  const [expandedChapter, setExpandedChapter] = useState(highlightChapter || null);
  const [selectedText, setSelectedText] = useState("");
  const [selectionPos, setSelectionPos] = useState(null);
  const containerRef = useRef(null);
  const chapterRefs = useRef({});

  useEffect(() => {
    if (highlightChapter && chapterRefs.current[highlightChapter]) {
      setExpandedChapter(highlightChapter);
      setTimeout(() => {
        chapterRefs.current[highlightChapter]?.scrollIntoView({ behavior: "smooth", block: "start" });
      }, 100);
    }
  }, [highlightChapter]);

  const handleMouseUp = () => {
    const selection = window.getSelection();
    const text = selection?.toString().trim();
    if (text && text.length > 10 && containerRef.current) {
      const range = selection.getRangeAt(0);
      const rect = range.getBoundingClientRect();
      const containerRect = containerRef.current.getBoundingClientRect();
      setSelectedText(text);
      setSelectionPos({ top: rect.top - containerRect.top - 48, left: Math.max(0, rect.left - containerRect.left) });
    } else { setSelectedText(""); setSelectionPos(null); }
  };

  const handleExplain = (text, heading) => {
    window._studysyncExplain?.(text, heading);
    setSelectedText(""); setSelectionPos(null);
    window.getSelection()?.removeAllRanges();
  };

  const chaptersWithNotes = mod.chapters.filter(ch => mod.lectureNotes[ch.id] && mod.lectureNotes[ch.id].length > 0);
  const chaptersNoNotes = mod.chapters.filter(ch => !mod.lectureNotes[ch.id] || mod.lectureNotes[ch.id].length === 0);
  const isWeak = (chId) => WEAK_TOPICS.some(w => w.course === mod.code && w.chapter === chId);

  return (
    <div className="space-y-4">
      {/* PDF Actions Bar */}
      <div className="bg-gradient-to-r from-slate-800 to-slate-900 rounded-2xl p-5 flex items-center justify-between">
        <div className="flex items-center gap-3">
          <div className="w-10 h-10 rounded-xl bg-red-500/20 flex items-center justify-center">
            <svg className="w-5 h-5 text-red-400" fill="currentColor" viewBox="0 0 20 20"><path d="M4 18h12a2 2 0 002-2V6l-4-4H4a2 2 0 00-2 2v12a2 2 0 002 2zm8-14l4 4h-4V4z"/></svg>
          </div>
          <div>
            <p className="text-sm font-semibold text-white">{mod.code} Lecture Notes</p>
            <p className="text-xs text-slate-400">{mod.pdfFile} · {mod.chapters.length} chapters</p>
          </div>
        </div>
        <div className="flex items-center gap-2">
          <button onClick={() => onOpenPDF(mod.pdfFile, `${mod.code} — Full Lecture Notes`, 1)}
            className="flex items-center gap-1.5 px-4 py-2 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-xs font-semibold text-white transition-colors">
            <svg className="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}><path strokeLinecap="round" strokeLinejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path strokeLinecap="round" strokeLinejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
            Open Full PDF
          </button>
          <button onClick={() => alert(`Downloading ${mod.pdfFile}...`)}
            className="flex items-center gap-1.5 px-4 py-2 rounded-xl bg-slate-700 hover:bg-slate-600 text-xs font-semibold text-slate-200 transition-colors">
            <svg className="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}><path strokeLinecap="round" strokeLinejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>
            Download PDF
          </button>
        </div>
      </div>

      {/* Chapter Jump List */}
      <div className="bg-white rounded-2xl border border-slate-200 p-4">
        <h4 className="text-xs font-semibold text-slate-500 uppercase tracking-wide mb-3">📑 Jump to Chapter in PDF</h4>
        <div className="grid grid-cols-1 sm:grid-cols-2 gap-2">
          {mod.chapters.map(ch => {
            const weak = isWeak(ch.id);
            return (
              <button key={ch.id} onClick={() => onOpenPDF(mod.pdfFile, `${mod.code} — Ch ${ch.num}: ${ch.title}`, ch.pdfPage)}
                className={`flex items-center gap-3 p-3 rounded-xl border text-left transition-all hover:shadow-sm ${weak ? "border-red-200 bg-red-50 hover:bg-red-100" : "border-slate-200 bg-slate-50 hover:bg-slate-100"}`}>
                <div className={`w-8 h-8 rounded-lg flex items-center justify-center text-xs font-bold flex-shrink-0 ${weak ? "bg-red-200 text-red-700" : "bg-slate-200 text-slate-600"}`}>{ch.num}</div>
                <div className="flex-1 min-w-0">
                  <p className="text-xs font-semibold text-slate-800 truncate">{ch.title}</p>
                  <p className="text-xs text-slate-400">Page {ch.pdfPage}</p>
                </div>
                {weak && <Badge color="red">Weak</Badge>}
                <svg className="w-4 h-4 text-slate-400 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}><path strokeLinecap="round" strokeLinejoin="round" d="M9 5l7 7-7 7"/></svg>
              </button>
            );
          })}
        </div>
      </div>

      {highlightChapter && (
        <div className="bg-yellow-50 border border-yellow-200 rounded-xl px-4 py-3 flex items-center justify-between">
          <p className="text-xs text-yellow-800 font-medium">📍 Navigated to weak chapter: <strong>Ch {mod.chapters.find(c=>c.id===highlightChapter)?.num} — {mod.chapters.find(c=>c.id===highlightChapter)?.title}</strong></p>
          <button onClick={onClearHighlight} className="text-xs text-yellow-600 hover:text-yellow-800 font-medium">Dismiss</button>
        </div>
      )}

      <div ref={containerRef} className="relative space-y-3 select-text" onMouseUp={handleMouseUp}>
        {selectedText && selectionPos && (
          <div className="absolute z-30 flex gap-1.5 bg-slate-900 text-white rounded-xl px-3 py-2 shadow-xl text-xs font-medium"
            style={{ top: `${selectionPos.top}px`, left: `${selectionPos.left}px`, transform: "translateY(-100%) translateY(-8px)" }}>
            <button onClick={() => handleExplain(selectedText, "Selected Topic")} className="flex items-center gap-1.5 hover:text-violet-300 transition-colors"><span>🧠</span> Explain This</button>
            <span className="text-slate-600">|</span>
            <button onClick={() => { setSelectedText(""); setSelectionPos(null); window.getSelection()?.removeAllRanges(); }} className="hover:text-red-300">✕</button>
          </div>
        )}

        {chaptersWithNotes.map(ch => {
          const notes = mod.lectureNotes[ch.id];
          const expanded = expandedChapter === ch.id;
          const weak = isWeak(ch.id);
          const isHighlighted = highlightChapter === ch.id;
          return (
            <div key={ch.id} ref={el => chapterRefs.current[ch.id] = el}
              className={`bg-white rounded-2xl border shadow-sm overflow-hidden transition-all ${isHighlighted ? "border-yellow-400 ring-2 ring-yellow-200 highlight-section" : weak ? "border-red-200" : "border-slate-200"}`}>
              <button onClick={() => setExpandedChapter(expanded ? null : ch.id)}
                className="w-full flex items-center gap-3 p-4 text-left hover:bg-slate-50 transition-colors">
                <div className={`w-9 h-9 rounded-xl flex items-center justify-center text-sm font-bold flex-shrink-0 ${weak ? "bg-red-100 text-red-700" : "bg-slate-100 text-slate-600"}`}>
                  {ch.num}
                </div>
                <div className="flex-1">
                  <p className="text-sm font-semibold text-slate-900 flex items-center gap-2">
                    {ch.title}
                    {weak && <Badge color="red">Weak</Badge>}
                    {isHighlighted && <Badge color="yellow">Focus</Badge>}
                  </p>
                  <p className="text-xs text-slate-400">{notes.length} section{notes.length > 1 ? "s" : ""} · Page {ch.pdfPage}</p>
                </div>
                <svg className={`w-5 h-5 text-slate-400 transition-transform ${expanded ? "rotate-180" : ""}`} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}><path strokeLinecap="round" strokeLinejoin="round" d="M19 9l-7 7-7-7"/></svg>
              </button>
              {expanded && (
                <div className="border-t border-slate-100 p-5 space-y-5">
                  {notes.map((section, i) => (
                    <div key={i} className="group">
                      <div className="flex items-start justify-between gap-2 mb-2">
                        <h4 className="text-sm font-semibold text-slate-800">{section.heading}</h4>
                        <button onClick={() => handleExplain(section.content, section.heading)}
                          className="opacity-0 group-hover:opacity-100 transition-opacity text-xs bg-violet-100 hover:bg-violet-200 text-violet-700 font-medium px-2.5 py-1 rounded-lg flex items-center gap-1 flex-shrink-0">
                          🧠 Explain
                        </button>
                      </div>
                      <p className="text-sm text-slate-600 leading-relaxed">{section.content}</p>
                      {i < notes.length - 1 && <div className="mt-4 h-px bg-slate-100" />}
                    </div>
                  ))}
                </div>
              )}
            </div>
          );
        })}

        {chaptersNoNotes.length > 0 && (
          <div className="mt-4">
            <p className="text-xs text-slate-400 mb-2">Other chapters (notes not yet uploaded):</p>
            <div className="space-y-2">
              {chaptersNoNotes.map(ch => (
                <div key={ch.id} className="flex items-center gap-3 p-3 rounded-xl border border-slate-100 bg-slate-50 opacity-60">
                  <div className="w-8 h-8 rounded-lg bg-slate-200 flex items-center justify-center text-xs font-bold text-slate-500">{ch.num}</div>
                  <p className="text-sm text-slate-500">{ch.title}</p>
                  <span className="ml-auto text-xs text-slate-400">Coming soon</span>
                </div>
              ))}
            </div>
          </div>
        )}
      </div>
    </div>
  );
};

const QuizPageCard = ({ topicId, quiz, weak, onEmailEscalate }) => {
  const [started, setStarted] = useState(false);
  const [selections, setSelections] = useState({});
  const [submitted, setSubmitted] = useState(false);
  const [score, setScore] = useState(null);

  if (!started) return (
    <div className="card-hover bg-white rounded-2xl border border-slate-200 p-6 shadow-sm">
      <div className="flex items-start justify-between mb-3"><div><h3 className="text-base font-bold text-slate-900">{quiz.topic}</h3><p className="text-xs text-slate-500">{quiz.course}</p></div>{weak && <Badge color={weak.score<50?"red":"orange"}>{weak.score}%</Badge>}</div>
      <p className="text-xs text-slate-400 mb-4">📝 3 questions · ⏱️ ~3 min · 🎯 MCQ</p>
      <button onClick={()=>setStarted(true)} className="w-full py-2.5 rounded-xl text-sm font-semibold bg-gradient-to-r from-indigo-600 to-violet-600 text-white hover:opacity-90">Start Quiz →</button>
    </div>
  );

  const handleSubmit = () => { let c=0; quiz.questions.forEach((q,i)=>{if(selections[i]===q.answer)c++;}); setScore(c); setSubmitted(true); };

  return (
    <div className="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
      <div className="bg-gradient-to-r from-indigo-500 to-violet-600 px-5 py-3"><h3 className="text-white font-bold text-sm">{quiz.topic}</h3><p className="text-indigo-200 text-xs">{quiz.course}</p></div>
      <div className="p-5 space-y-5">
        {quiz.questions.map((q, qIdx) => (
          <div key={qIdx} className="space-y-2">
            <p className="text-sm font-medium text-slate-800">Q{qIdx+1}. {q.q}</p>
            {q.options.map((opt, oIdx) => {
              let cls = "quiz-option w-full text-left text-xs px-3 py-2.5 rounded-xl border cursor-pointer ";
              if (!submitted) cls += selections[qIdx]===oIdx ? "bg-indigo-50 border-indigo-400 text-indigo-700 font-medium" : "bg-white border-slate-200 text-slate-700";
              else if (oIdx===q.answer) cls += "bg-emerald-50 border-emerald-400 text-emerald-800 font-medium submitted";
              else if (oIdx===selections[qIdx]) cls += "bg-red-50 border-red-300 text-red-700 submitted";
              else cls += "bg-white border-slate-100 text-slate-400 submitted";
              return <button key={oIdx} className={cls} onClick={()=>{if(!submitted)setSelections(p=>({...p,[qIdx]:oIdx}))}}>{String.fromCharCode(65+oIdx)}. {opt}{submitted&&oIdx===q.answer&&" ✓"}{submitted&&oIdx===selections[qIdx]&&selections[qIdx]!==q.answer&&" ✗"}</button>;
            })}
            {submitted && <p className="text-xs px-3 py-2 rounded-lg bg-blue-50 text-blue-700">💬 {q.explanation}</p>}
          </div>
        ))}
      </div>
      <div className="px-5 pb-5">
        {!submitted ? <button onClick={handleSubmit} disabled={Object.keys(selections).length<3} className="w-full py-2.5 rounded-xl text-sm font-semibold bg-gradient-to-r from-indigo-600 to-violet-600 text-white disabled:opacity-40">Submit ({Object.keys(selections).length}/3)</button>
        : <div className="space-y-2"><div className={`text-center py-2 rounded-xl font-semibold text-sm ${score===3?"bg-emerald-100 text-emerald-700":score>=2?"bg-blue-100 text-blue-700":"bg-red-100 text-red-700"}`}>Score: {score}/3</div><div className="flex gap-2"><button onClick={()=>{setSelections({});setSubmitted(false);setScore(null);}} className="flex-1 py-2 rounded-xl text-xs font-semibold border border-slate-200 text-slate-600 hover:bg-slate-50">↺ Retry</button>{score<3&&<button onClick={()=>onEmailEscalate(quiz.topic,quiz.course)} className="flex-1 py-2 rounded-xl text-xs font-semibold bg-amber-50 border border-amber-200 text-amber-700">✉️ Ask Prof</button>}</div></div>}
      </div>
    </div>
  );
};



// ═══════════════════════════════════════════════════════════════════════════════
// NAVIGATION
// ═══════════════════════════════════════════════════════════════════════════════

const NAV_ITEMS = [
  { id: "dashboard", icon: "📊", label: "Dashboard" },
  { id: "modules", icon: "📚", label: "Modules" },
  { id: "quizzes", icon: "📝", label: "Quizzes" },
  { id: "support", icon: "✉️", label: "Support" },
];

const Sidebar = ({ activePage, setActivePage }) => (
  <aside className="w-52 bg-white border-r border-slate-200 flex flex-col flex-shrink-0 hidden lg:flex">
    <div className="flex items-center gap-2.5 px-4 py-4 border-b border-slate-100">
      <div className="w-8 h-8 rounded-xl bg-gradient-to-br from-violet-600 to-indigo-600 flex items-center justify-center text-white text-sm font-bold">S</div>
      <span className="text-base font-bold bg-gradient-to-r from-violet-700 to-indigo-600 bg-clip-text text-transparent">StudySync AI</span>
    </div>
    <nav className="flex-1 py-3 px-3 space-y-1">
      {NAV_ITEMS.map(item => (
        <button key={item.id} onClick={() => setActivePage(item.id)}
          className={`sidebar-item w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium text-left ${activePage === item.id || (item.id === "modules" && activePage === "module-detail") ? "active bg-indigo-50 text-indigo-700 shadow-sm" : "text-slate-600 hover:text-slate-900"}`}>
          <span className="text-base">{item.icon}</span><span>{item.label}</span>
        </button>
      ))}
    </nav>
    <div className="p-3 border-t border-slate-100">
      <div className="flex items-center gap-2.5 px-3 py-2 rounded-xl bg-slate-50">
        <div className="w-8 h-8 rounded-full bg-gradient-to-br from-violet-500 to-indigo-600 flex items-center justify-center text-white text-xs font-bold">{STUDENT.avatar}</div>
        <div className="flex-1 min-w-0"><p className="text-xs font-semibold text-slate-800 truncate">{STUDENT.name}</p><p className="text-xs text-slate-400 truncate">{STUDENT.major}</p></div>
      </div>
    </div>
  </aside>
);

const MobileNav = ({ activePage, setActivePage }) => (
  <nav className="lg:hidden bg-white border-b border-slate-200 px-3 py-2 flex items-center gap-2 overflow-x-auto flex-shrink-0">
    <div className="w-7 h-7 rounded-lg bg-gradient-to-br from-violet-600 to-indigo-600 flex items-center justify-center text-white text-xs font-bold flex-shrink-0">S</div>
    <div className="flex items-center gap-1 bg-slate-100 rounded-xl p-1 flex-1">
      {NAV_ITEMS.map(item => (
        <button key={item.id} onClick={() => setActivePage(item.id)}
          className={`flex-1 px-2 py-1.5 rounded-lg text-xs font-medium whitespace-nowrap ${activePage === item.id || (item.id === "modules" && activePage === "module-detail") ? "bg-white text-slate-800 shadow-sm" : "text-slate-500"}`}>
          {item.icon} {item.label}
        </button>
      ))}
    </div>
  </nav>
);



// ═══════════════════════════════════════════════════════════════════════════════
// MAIN APP — State-based routing
// ═══════════════════════════════════════════════════════════════════════════════

const App = () => {
  const [activePage, setActivePage] = useState("dashboard");
  const [emailModal, setEmailModal] = useState(null);
  const [pdfModal, setPdfModal] = useState(null);

  // Module detail state
  const [selectedModule, setSelectedModule] = useState(null);
  const [moduleInitialTab, setModuleInitialTab] = useState(null);
  const [moduleHighlightChapter, setModuleHighlightChapter] = useState(null);

  const openEmail = (topic, course, professor) => setEmailModal({ topic, course, professor });
  const closeEmail = () => setEmailModal(null);

  const openPDF = (fileName, title, page) => setPdfModal({ fileName, title, initialPage: page || 1 });
  const closePDF = () => setPdfModal(null);

  // Navigate to a module's detail page
  const goToModule = (code, tab, chapter) => {
    setSelectedModule(code);
    setModuleInitialTab(tab || "tests");
    setModuleHighlightChapter(chapter || null);
    setActivePage("module-detail");
  };

  // Navigate to lecture notes for a weak topic
  const goToWeakTopicNotes = (courseCode, chapterId) => {
    goToModule(courseCode, "notes", chapterId);
  };

  // Quiz in chat handler
  const handleQuizInChat = (topicId, topicName) => {
    if (window._studysyncQuizRequest) window._studysyncQuizRequest(topicId, topicName);
  };

  const renderPage = () => {
    switch (activePage) {
      case "dashboard":
        return (
          <div className="grid grid-cols-1 xl:grid-cols-2 gap-5 max-w-5xl">
            <StudentProfileCard />
            <TasksCard />
            <TimetableCard />
            <WeakTopicsCard onQuizRequest={handleQuizInChat} onEmailEscalate={openEmail} onViewNotes={goToWeakTopicNotes} />
          </div>
        );
      case "modules":
        return <ModulesPage onSelectModule={(code) => goToModule(code, "tests", null)} />;
      case "module-detail":
        return <ModuleDetailPage moduleCode={selectedModule} onBack={() => setActivePage("modules")} initialTab={moduleInitialTab} highlightChapter={moduleHighlightChapter} onEmailEscalate={openEmail} onOpenPDF={openPDF} />;
      case "quizzes":
        return <QuizzesPage onEmailEscalate={openEmail} />;
      case "support":
        return <SupportPage onEmailEscalate={openEmail} />;
      default:
        return null;
    }
  };

  const pageHeaders = {
    dashboard: { title: "Dashboard", subtitle: "Your learning overview at a glance" },
    modules: { title: "My Modules", subtitle: "Click a module to explore" },
    "module-detail": { title: selectedModule ? `${selectedModule}: ${MODULES[selectedModule]?.name || ""}` : "Module", subtitle: "Past tests, lecture notes & tutorials" },
    quizzes: { title: "Practice Quizzes", subtitle: "Test your knowledge on weak topics" },
    support: { title: "Faculty Support", subtitle: "Get help from your professors" },
  };

  return (
    <div className="h-screen flex bg-slate-50 overflow-hidden">
      <Sidebar activePage={activePage} setActivePage={(p) => { setActivePage(p); setSelectedModule(null); setModuleHighlightChapter(null); }} />
      <div className="flex-1 flex flex-col overflow-hidden min-w-0">
        <MobileNav activePage={activePage} setActivePage={(p) => { setActivePage(p); setSelectedModule(null); setModuleHighlightChapter(null); }} />
        <header className="bg-white border-b border-slate-200 px-6 py-3 flex items-center justify-between flex-shrink-0">
          <div><h1 className="text-base font-bold text-slate-900">{pageHeaders[activePage]?.title}</h1><p className="text-xs text-slate-400">{pageHeaders[activePage]?.subtitle}</p></div>
          <span className="text-xs text-slate-400 hidden sm:inline">Week 3, Mon · AY2025/26</span>
        </header>
        <div className="flex-1 flex overflow-hidden">
          <main className="flex-1 overflow-y-auto p-5 scrollbar-thin">{renderPage()}</main>
          <div className="w-[370px] xl:w-[400px] flex-shrink-0 p-3 pl-0 hidden md:flex"><div className="flex-1 h-full"><ChatPanel onEmailEscalate={openEmail} /></div></div>
        </div>
      </div>
      {emailModal && <EmailModal topic={emailModal.topic} course={emailModal.course} professor={emailModal.professor} onClose={closeEmail} />}
      {pdfModal && <PDFViewerModal fileName={pdfModal.fileName} title={pdfModal.title} initialPage={pdfModal.initialPage} totalPages={120} onClose={closePDF} />}
    </div>
  );
};

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
