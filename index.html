const ScoreBar = ({ score, height = "h-1.5" }) => {

};

const MarkdownText = ({ text }) => {
  const lines = text.split("\n");
  return (
    <div className="space-y-1 text-sm leading-relaxed">
      {lines.map((line, i) => {
        if (!line.trim()) return <div key={i} className="h-1" />;
        if (line.startsWith("**") && line.endsWith("**")) return <p key={i} className="font-semibold text-slate-800">{line.replace(/\*\*/g, "")}</p>;
        const bold = line.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
        if (line.startsWith("•")) return <p key={i} className="pl-3 text-slate-700" dangerouslySetInnerHTML={{ __html: bold }} />;
        return <p key={i} className="text-slate-700" dangerouslySetInnerHTML={{ __html: bold }} />;
      })}
    </div>
  );
};

  const [currentPage, setCurrentPage] = useState(initialPage || 1);
  const [jumpInput, setJumpInput] = useState("");
  const pages = totalPages || 120;
  const goToPage = (p) => { const pg = Math.max(1, Math.min(pages, p)); setCurrentPage(pg); };

          <div><label className="block text-xs font-medium text-slate-500 mb-1">SUBJECT</label><div className="bg-slate-50 border border-slate-200 rounded-lg px-3 py-2 text-sm text-slate-700 font-medium">{subject}</div></div>

// QUIZ CARD (for chat)
// ═══════════════════════════════════════════════════════════════════════════════

const QuizCard = ({ topicId, onEmailEscalate }) => {
  const quiz = QUIZ_BANK[topicId];
  const [selections, setSelections] = useState({});
  const [submitted, setSubmitted] = useState(false);
  const [score, setScore] = useState(null);
  if (!quiz) return null;
  const handleSelect = (qIdx, oIdx) => { if (!submitted) setSelections(prev => ({ ...prev, [qIdx]: oIdx })); };
  const handleSubmit = () => { if (Object.keys(selections).length < quiz.questions.length) return; let c = 0; quiz.questions.forEach((q, i) => { if (selections[i] === q.answer) c++; }); setScore(c); setSubmitted(true); };
  const handleReset = () => { setSelections({}); setSubmitted(false); setScore(null); };

  return (
    <div className="bg-white rounded-xl border border-slate-200 overflow-hidden mt-2">
      <div className="bg-gradient-to-r from-indigo-500 to-violet-600 px-4 py-2.5"><span className="text-white text-sm font-semibold">📝 Quiz: {quiz.topic}</span></div>
      <div className="p-4 space-y-4">
        {quiz.questions.map((q, qIdx) => (
          <div key={qIdx} className="space-y-1.5">
            <p className="text-sm font-medium text-slate-800">Q{qIdx+1}. {q.q}</p>
            {q.options.map((opt, oIdx) => {
              let cls = "quiz-option w-full text-left text-xs px-3 py-2 rounded-lg border cursor-pointer ";
              if (!submitted) cls += selections[qIdx] === oIdx ? "bg-indigo-50 border-indigo-400 text-indigo-700 font-medium" : "bg-white border-slate-200 text-slate-700";
              else if (oIdx === q.answer) cls += "bg-emerald-50 border-emerald-400 text-emerald-800 font-medium submitted";
              else if (oIdx === selections[qIdx]) cls += "bg-red-50 border-red-300 text-red-700 submitted";
              else cls += "bg-white border-slate-100 text-slate-400 submitted";
              return <button key={oIdx} className={cls} onClick={() => handleSelect(qIdx, oIdx)}><span className="font-mono mr-2">{String.fromCharCode(65+oIdx)}.</span>{opt}{submitted && oIdx === q.answer && " ✓"}{submitted && oIdx === selections[qIdx] && selections[qIdx] !== q.answer && " ✗"}</button>;
            })}
            {submitted && <p className="text-xs px-3 py-2 rounded-lg bg-blue-50 text-blue-700">💬 {q.explanation}</p>}
          </div>
        ))}
      </div>
      <div className="px-4 pb-4">
        {!submitted ? <button onClick={handleSubmit} disabled={Object.keys(selections).length < quiz.questions.length} className="w-full py-2 rounded-xl text-sm font-semibold bg-gradient-to-r from-indigo-600 to-violet-600 text-white disabled:opacity-40">Submit ({Object.keys(selections).length}/3)</button>
        : <div className="space-y-2"><div className={`text-center py-2 rounded-xl text-sm font-semibold ${score===3?"bg-emerald-100 text-emerald-700":score>=2?"bg-blue-100 text-blue-700":"bg-red-100 text-red-700"}`}>Score: {score}/3</div><div className="flex gap-2"><button onClick={handleReset} className="flex-1 py-2 rounded-xl text-xs font-semibold border border-slate-200 text-slate-600 hover:bg-slate-50">↺ Retry</button>{score<3&&<button onClick={()=>onEmailEscalate(quiz.topic,quiz.course)} className="flex-1 py-2 rounded-xl text-xs font-semibold bg-amber-50 border border-amber-200 text-amber-700">✉️ Ask Prof</button>}</div></div>}
      </div>
    </div>
  );
};

// CHAT PANEL (persistent right side)
// ═══════════════════════════════════════════════════════════════════════════════

const ChatPanel = ({ onEmailEscalate }) => {
  const [messages, setMessages] = useState([{ id: 1, role: "ai", type: "text", text: "Hi Alex! 👋 I'm your **StudySync AI** copilot.\n\n• **Explain concepts** — highlight text in Lecture Notes\n• **Practice quizzes** — test your weak topics\n• **Email professors** — one-click escalation\n\nAsk me anything!" }]);
  const [input, setInput] = useState("");
  const [isTyping, setIsTyping] = useState(false);
  const endRef = useRef(null);
  useEffect(() => { endRef.current?.scrollIntoView({ behavior: "smooth" }); }, [messages]);
  const add = (msg) => setMessages(p => [...p, { id: Date.now()+Math.random(), ...msg }]);
  const typing = (cb, d=900) => { setIsTyping(true); setTimeout(() => { setIsTyping(false); cb(); }, d); };
  const handleExplain = useCallback((text, topic) => { add({ role: "user", type: "text", text: `Explain: "${text.substring(0,50)}..."` }); typing(() => { add({ role: "ai", type: "text", text: AI_RESPONSES.explain(topic, text) }); add({ role: "ai", type: "escalate-prompt", topic, course: "CG1111A" }); }, 1000); }, []);
  const handleQuizRequest = useCallback((topicId, topicName) => { add({ role: "user", type: "text", text: `Quiz me on: ${topicName}` }); typing(() => { add({ role: "ai", type: "text", text: AI_RESPONSES.quiz_intro(topicName) }); add({ role: "ai", type: "quiz", topicId }); }, 800); }, []);
  const handleSend = () => {
    const t = input.trim(); if (!t) return;
    add({ role: "user", type: "text", text: t }); setInput("");
    const lower = t.toLowerCase();
    typing(() => {
      if (lower.includes("quiz") || lower.includes("practice")) { add({ role: "ai", type: "text", text: "Which topic? Pick one:" }); add({ role: "ai", type: "quiz-picker" }); }
      else if (lower.includes("explain") || lower.includes("what is")) { add({ role: "ai", type: "text", text: "Highlight text in **Lecture Notes** and click **Explain This**, or go to a module's notes page!" }); }
      else if (lower.includes("email") || lower.includes("prof")) { add({ role: "ai", type: "escalate-prompt", topic: "State Machines", course: "CG1111A" }); }
      else { add({ role: "ai", type: "text", text: `I can help with that! Try:\n• Highlighting lecture notes → "Explain This"\n• Opening a module → Past Tests to see weak chapters\n• Asking me: *"Quiz me on State Machines"*` }); }
    });
  };
  window._studysyncExplain = handleExplain;
  window._studysyncQuizRequest = handleQuizRequest;


  return (
    <div className="flex flex-col h-full bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
      <div className="flex items-center gap-3 px-4 py-3 border-b border-slate-100 bg-gradient-to-r from-violet-50 to-indigo-50 flex-shrink-0">
        <div className="relative"><div className="w-9 h-9 rounded-xl bg-gradient-to-br from-violet-500 to-indigo-600 flex items-center justify-center text-white text-sm font-bold">AI</div><span className="absolute -bottom-0.5 -right-0.5 w-3 h-3 bg-emerald-400 rounded-full border-2 border-white pulse-dot" /></div>
        <div><p className="text-sm font-semibold text-slate-900">StudySync AI</p><p className="text-xs text-slate-400">Always online</p></div>
      </div>
      <div className="flex-1 overflow-y-auto scrollbar-thin p-4 space-y-3">
        {messages.map(msg => (
          <div key={msg.id} className={`flex ${msg.role==="user"?"justify-end":"justify-start"}`}>
            {msg.role === "ai" && (
              <div className="flex flex-col gap-1 max-w-[88%]">
                {msg.type === "text" && <div className="chat-bubble-ai rounded-2xl rounded-tl-sm px-4 py-3 border border-blue-100"><MarkdownText text={msg.text} /></div>}
                {msg.type === "escalate-prompt" && (<div className="bg-amber-50 border border-amber-200 rounded-2xl rounded-tl-sm px-4 py-3"><p className="text-xs text-amber-700 font-medium mb-2">Need more help? Escalate to your professor.</p><button onClick={() => onEmailEscalate(msg.topic, msg.course)} className="w-full py-2 rounded-xl text-xs font-semibold bg-gradient-to-r from-amber-500 to-orange-500 text-white hover:opacity-90">✉️ Draft Email to Prof</button></div>)}
                {msg.type === "quiz" && <QuizCard topicId={msg.topicId} onEmailEscalate={onEmailEscalate} />}
                {msg.type === "quiz-picker" && (<div className="chat-bubble-ai rounded-2xl rounded-tl-sm px-4 py-3 border border-blue-100 space-y-2">{WEAK_TOPICS.map(t => <button key={t.id} onClick={() => handleQuizRequest(t.id, t.topic)} className="w-full text-left px-3 py-2 rounded-xl bg-white border border-slate-200 hover:border-violet-300 hover:bg-violet-50 text-xs font-medium text-slate-700 flex justify-between"><span>{t.chapterLabel}: {t.topic}</span><span className="text-red-500">{t.score}%</span></button>)}</div>)}
              </div>
            )}
            {msg.role === "user" && <div className="chat-bubble-user rounded-2xl rounded-tr-sm px-4 py-3 max-w-[80%]"><p className="text-sm text-white">{msg.text}</p></div>}
          </div>
        ))}
        {isTyping && <div className="flex justify-start"><div className="chat-bubble-ai rounded-2xl rounded-tl-sm px-4 py-3 border border-blue-100 flex gap-1.5">{[0,150,300].map(d=><span key={d} className="w-2 h-2 bg-indigo-400 rounded-full pulse-dot" style={{animationDelay:`${d}ms`}}/>)}</div></div>}
        <div ref={endRef} />
      </div>

      <div className="p-3 border-t border-slate-100 bg-slate-50 flex-shrink-0">
        <div className="flex items-end gap-2 bg-white rounded-xl border border-slate-200 shadow-sm px-3 py-2">
          <textarea rows={1} value={input} onChange={e=>setInput(e.target.value)} onKeyDown={e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();handleSend();}}} placeholder="Ask anything…" className="flex-1 text-sm text-slate-700 resize-none outline-none bg-transparent placeholder-slate-400 max-h-20 py-0.5" />
          <button onClick={handleSend} disabled={!input.trim()} className="w-8 h-8 rounded-lg bg-gradient-to-br from-violet-600 to-indigo-600 text-white flex items-center justify-center disabled:opacity-30 flex-shrink-0"><svg className="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2.5}><path strokeLinecap="round" strokeLinejoin="round" d="M6 12L3.269 3.126A59.768 59.768 0 0121.485 12 59.77 59.77 0 013.269 20.876L5.999 12zm0 0h7.5" /></svg></button>
        </div>
      </div>
    </div>
  );
};

// PAST TESTS VIEW
// ═══════════════════════════════════════════════════════════════════════════════

const PastTestsView = ({ mod, onViewNotes, onOpenPDF }) => {
  const [expandedTest, setExpandedTest] = useState(null);
  const chapterWeakness = {};
  mod.pastTests.forEach(test => { test.questions.forEach(q => { if (!chapterWeakness[q.chapter]) chapterWeakness[q.chapter] = { total: 0, lost: 0, wrong: 0, topics: [] }; chapterWeakness[q.chapter].total += q.maxMarks; if (!q.correct) { chapterWeakness[q.chapter].lost += (q.maxMarks - q.scored); chapterWeakness[q.chapter].wrong++; if (!chapterWeakness[q.chapter].topics.includes(q.topic)) chapterWeakness[q.chapter].topics.push(q.topic); } }); });
  const sortedWeakChapters = Object.entries(chapterWeakness).filter(([_, d]) => d.wrong > 0).sort((a, b) => b[1].lost - a[1].lost);

  return (
    <div className="space-y-5">
      {sortedWeakChapters.length > 0 && (
        <div className="bg-red-50 border border-red-200 rounded-2xl p-5">
          <h3 className="text-sm font-semibold text-red-900 flex items-center gap-2 mb-3">⚠️ Chapter Weakness Analysis <Badge color="red">{sortedWeakChapters.length} weak</Badge></h3>
          <div className="space-y-3">
            {sortedWeakChapters.map(([chId, data]) => {
              const ch = mod.chapters.find(c => c.id === chId);
              const pct = Math.round((1 - data.lost / data.total) * 100);
              return (
                <div key={chId} className="bg-white rounded-xl border border-red-100 p-4">
                  <div className="flex items-start justify-between mb-2"><div><p className="text-sm font-semibold text-slate-800">Ch {ch?.num}: {ch?.title}</p><p className="text-xs text-red-600 mt-0.5">{data.wrong} wrong · {data.lost} marks lost</p></div><p className={`text-sm font-bold ${pct<50?"text-red-600":"text-yellow-600"}`}>{pct}%</p></div>
                  <ScoreBar score={pct} height="h-2" />
                  <div className="mt-2 flex flex-wrap gap-1">{data.topics.map(t => <span key={t} className="text-xs bg-red-100 text-red-700 px-2 py-0.5 rounded-full">{t}</span>)}</div>
                  <button onClick={() => onViewNotes(chId)} className="mt-3 w-full py-2 rounded-xl text-xs font-semibold bg-violet-50 border border-violet-200 text-violet-700 hover:bg-violet-100">📖 View Lecture Notes</button>
                </div>
              );
            })}
          </div>
        </div>
      )}

      <div className="space-y-4">
        <h3 className="text-sm font-semibold text-slate-900">📋 All Tests & Exams</h3>
        {mod.pastTests.map(test => {
          const pct = Math.round(test.totalScore / test.maxScore * 100);
          const isExpanded = expandedTest === test.id;
          return (
            <div key={test.id} className="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
              <button onClick={() => setExpandedTest(isExpanded ? null : test.id)} className="w-full flex items-center gap-4 p-5 text-left hover:bg-slate-50 transition-colors">
                <div className={`w-12 h-12 rounded-xl flex items-center justify-center text-white font-bold text-sm ${pct >= 70 ? "bg-emerald-500" : pct >= 50 ? "bg-yellow-500" : "bg-red-500"}`}>{pct}%</div>
                <div className="flex-1"><p className="text-sm font-semibold text-slate-900">{test.title}</p><p className="text-xs text-slate-500">{new Date(test.date).toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"})} · {test.duration} · {test.totalScore}/{test.maxScore}</p></div>
                <Badge color={pct >= 70 ? "green" : pct >= 50 ? "orange" : "red"}>{test.questions.filter(q=>!q.correct).length} wrong</Badge>
                <svg className={`w-5 h-5 text-slate-400 transition-transform ${isExpanded?"rotate-180":""}`} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}><path strokeLinecap="round" strokeLinejoin="round" d="M19 9l-7 7-7-7"/></svg>
              </button>
              {isExpanded && (
                <div className="border-t border-slate-100 p-5 space-y-4">
                  {test.questions.map(q => {
                    const ch = mod.chapters.find(c => c.id === q.chapter);
                    return (
                      <div key={q.num} className={`rounded-xl border overflow-hidden ${q.correct ? "border-emerald-200" : "border-red-200"}`}>
                        <div className={`flex items-center gap-3 p-4 ${q.correct ? "bg-emerald-50" : "bg-red-50"}`}>
                          <span className={`w-8 h-8 rounded-lg flex items-center justify-center text-xs font-bold flex-shrink-0 ${q.correct ? "bg-emerald-200 text-emerald-800" : "bg-red-200 text-red-800"}`}>{q.correct ? "✓" : "✗"}</span>
                          <div className="flex-1 min-w-0"><p className="text-sm font-semibold text-slate-800">Q{q.num}: {q.topic}</p><p className="text-xs text-slate-500">Ch {ch?.num}: {ch?.title} · {q.scored}/{q.maxMarks}</p></div>
                          <p className={`text-lg font-bold ${q.correct ? "text-emerald-700" : "text-red-700"}`}>{q.scored}/{q.maxMarks}</p>
                        </div>

                        <div className="p-4 bg-white space-y-3">
                          <div><p className="text-xs font-semibold text-slate-500 uppercase tracking-wide mb-1">Question</p><p className="text-sm text-slate-700 leading-relaxed bg-slate-50 rounded-lg p-3 border border-slate-100">{q.questionText}</p></div>
                          <div><p className="text-xs font-semibold text-slate-500 uppercase tracking-wide mb-1">Your Answer</p><div className={`text-sm leading-relaxed rounded-lg p-3 border ${q.correct ? "bg-emerald-50 border-emerald-200 text-emerald-800" : "bg-red-50 border-red-200 text-red-800"}`}>{q.studentAnswer}</div></div>

const LectureNotesView = ({ mod, highlightChapter, onClearHighlight, onOpenPDF }) => {
  const [expandedChapter, setExpandedChapter] = useState(highlightChapter || null);
  const [selectedText, setSelectedText] = useState("");
  const [selectionPos, setSelectionPos] = useState(null);
  const containerRef = useRef(null);
  const chapterRefs = useRef({});
  useEffect(() => { if (highlightChapter && chapterRefs.current[highlightChapter]) { setExpandedChapter(highlightChapter); setTimeout(() => { chapterRefs.current[highlightChapter]?.scrollIntoView({ behavior: "smooth", block: "start" }); }, 100); } }, [highlightChapter]);
  const handleMouseUp = () => { const sel = window.getSelection(); const text = sel?.toString().trim(); if (text && text.length > 10 && containerRef.current) { const range = sel.getRangeAt(0); const rect = range.getBoundingClientRect(); const cr = containerRef.current.getBoundingClientRect(); setSelectedText(text); setSelectionPos({ top: rect.top - cr.top - 48, left: Math.max(0, rect.left - cr.left) }); } else { setSelectedText(""); setSelectionPos(null); } };
  const handleExplain = (text, heading) => { window._studysyncExplain?.(text, heading); setSelectedText(""); setSelectionPos(null); window.getSelection()?.removeAllRanges(); };
  const chaptersWithNotes = mod.chapters.filter(ch => mod.lectureNotes[ch.id]?.length > 0);
  const chaptersNoNotes = mod.chapters.filter(ch => !mod.lectureNotes[ch.id]?.length);

  return (
    <div className="space-y-4">
      <div className="bg-gradient-to-r from-slate-800 to-slate-900 rounded-2xl p-5 flex items-center justify-between">

        </div>
      </div>

      <div className="bg-white rounded-2xl border border-slate-200 p-4">
        <h4 className="text-xs font-semibold text-slate-500 uppercase tracking-wide mb-3">📑 Jump to Chapter in PDF</h4>
        <div className="grid grid-cols-1 sm:grid-cols-2 gap-2">
          {mod.chapters.map(ch => { const weak = isWeak(ch.id); return (
            <button key={ch.id} onClick={() => onOpenPDF(mod.pdfFile, `${mod.code} — Ch ${ch.num}: ${ch.title}`, ch.pdfPage)} className={`flex items-center gap-3 p-3 rounded-xl border text-left transition-all hover:shadow-sm ${weak ? "border-red-200 bg-red-50 hover:bg-red-100" : "border-slate-200 bg-slate-50 hover:bg-slate-100"}`}>
              <div className={`w-8 h-8 rounded-lg flex items-center justify-center text-xs font-bold flex-shrink-0 ${weak ? "bg-red-200 text-red-700" : "bg-slate-200 text-slate-600"}`}>{ch.num}</div>
              <div className="flex-1 min-w-0"><p className="text-xs font-semibold text-slate-800 truncate">{ch.title}</p><p className="text-xs text-slate-400">Page {ch.pdfPage}</p></div>
              {weak && <Badge color="red">Weak</Badge>}
            </button>
          ); })}
        </div>
      </div>
      {highlightChapter && <div className="bg-yellow-50 border border-yellow-200 rounded-xl px-4 py-3 flex items-center justify-between"><p className="text-xs text-yellow-800 font-medium">📍 Navigated to: <strong>Ch {mod.chapters.find(c=>c.id===highlightChapter)?.num} — {mod.chapters.find(c=>c.id===highlightChapter)?.title}</strong></p><button onClick={onClearHighlight} className="text-xs text-yellow-600 hover:text-yellow-800 font-medium">Dismiss</button></div>}

      <div ref={containerRef} className="relative space-y-3 select-text" onMouseUp={handleMouseUp}>
        {selectedText && selectionPos && (<div className="absolute z-30 flex gap-1.5 bg-slate-900 text-white rounded-xl px-3 py-2 shadow-xl text-xs font-medium" style={{ top: `${selectionPos.top}px`, left: `${selectionPos.left}px`, transform: "translateY(-100%) translateY(-8px)" }}><button onClick={() => handleExplain(selectedText, "Selected Topic")} className="flex items-center gap-1.5 hover:text-violet-300">🧠 Explain This</button><span className="text-slate-600">|</span><button onClick={() => { setSelectedText(""); setSelectionPos(null); window.getSelection()?.removeAllRanges(); }} className="hover:text-red-300">✕</button></div>)}
        {chaptersWithNotes.map(ch => { const notes = mod.lectureNotes[ch.id]; const expanded = expandedChapter === ch.id; const weak = isWeak(ch.id); const isHL = highlightChapter === ch.id; return (
          <div key={ch.id} ref={el => chapterRefs.current[ch.id] = el} className={`bg-white rounded-2xl border shadow-sm overflow-hidden transition-all ${isHL ? "border-yellow-400 ring-2 ring-yellow-200 highlight-section" : weak ? "border-red-200" : "border-slate-200"}`}>

              <div className="flex-1"><p className="text-sm font-semibold text-slate-900 flex items-center gap-2">{ch.title}{weak && <Badge color="red">Weak</Badge>}{isHL && <Badge color="yellow">Focus</Badge>}</p><p className="text-xs text-slate-400">{notes.length} section{notes.length>1?"s":""} · Page {ch.pdfPage}</p></div>

            </button>
            {expanded && (<div className="border-t border-slate-100 p-5 space-y-5">{notes.map((section, i) => (<div key={i} className="group"><div className="flex items-start justify-between gap-2 mb-2"><h4 className="text-sm font-semibold text-slate-800">{section.heading}</h4><button onClick={() => handleExplain(section.content, section.heading)} className="opacity-0 group-hover:opacity-100 transition-opacity text-xs bg-violet-100 hover:bg-violet-200 text-violet-700 font-medium px-2.5 py-1 rounded-lg flex-shrink-0">🧠 Explain</button></div><p className="text-sm text-slate-600 leading-relaxed">{section.content}</p>{i < notes.length - 1 && <div className="mt-4 h-px bg-slate-100" />}</div>))}</div>)}
          </div>
        ); })}

        {chaptersNoNotes.length > 0 && (<div className="mt-4"><p className="text-xs text-slate-400 mb-2">Other chapters (notes not yet uploaded):</p><div className="space-y-2">{chaptersNoNotes.map(ch => (<div key={ch.id} className="flex items-center gap-3 p-3 rounded-xl border border-slate-100 bg-slate-50 opacity-60"><div className="w-8 h-8 rounded-lg bg-slate-200 flex items-center justify-center text-xs font-bold text-slate-500">{ch.num}</div><p className="text-sm text-slate-500">{ch.title}</p><span className="ml-auto text-xs text-slate-400">Coming soon</span></div>))}</div></div>)}
      </div>
    </div>
  );
};

    </div>
  </div>

const QuizPageCard = ({ topicId, quiz, weak, onEmailEscalate }) => {
  const [started, setStarted] = useState(false);
  const [selections, setSelections] = useState({});
  const [submitted, setSubmitted] = useState(false);
  const [score, setScore] = useState(null);
  if (!started) return (<div className="card-hover bg-white rounded-2xl border border-slate-200 p-6 shadow-sm"><div className="flex items-start justify-between mb-3"><div><h3 className="text-base font-bold text-slate-900">{quiz.topic}</h3><p className="text-xs text-slate-500">{quiz.course}</p></div>{weak && <Badge color={weak.score<50?"red":"orange"}>{weak.score}%</Badge>}</div><p className="text-xs text-slate-400 mb-4">📝 3 questions · ⏱️ ~3 min · 🎯 MCQ</p><button onClick={()=>setStarted(true)} className="w-full py-2.5 rounded-xl text-sm font-semibold bg-gradient-to-r from-indigo-600 to-violet-600 text-white hover:opacity-90">Start Quiz →</button></div>);
  const handleSubmit = () => { let c=0; quiz.questions.forEach((q,i)=>{if(selections[i]===q.answer)c++;}); setScore(c); setSubmitted(true); };
  return (
    <div className="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
      <div className="bg-gradient-to-r from-indigo-500 to-violet-600 px-5 py-3"><h3 className="text-white font-bold text-sm">{quiz.topic}</h3><p className="text-indigo-200 text-xs">{quiz.course}</p></div>
      <div className="p-5 space-y-5">
        {quiz.questions.map((q, qIdx) => (<div key={qIdx} className="space-y-2"><p className="text-sm font-medium text-slate-800">Q{qIdx+1}. {q.q}</p>{q.options.map((opt, oIdx) => { let cls = "quiz-option w-full text-left text-xs px-3 py-2.5 rounded-xl border cursor-pointer "; if (!submitted) cls += selections[qIdx]===oIdx ? "bg-indigo-50 border-indigo-400 text-indigo-700 font-medium" : "bg-white border-slate-200 text-slate-700"; else if (oIdx===q.answer) cls += "bg-emerald-50 border-emerald-400 text-emerald-800 font-medium submitted"; else if (oIdx===selections[qIdx]) cls += "bg-red-50 border-red-300 text-red-700 submitted"; else cls += "bg-white border-slate-100 text-slate-400 submitted"; return <button key={oIdx} className={cls} onClick={()=>{if(!submitted)setSelections(p=>({...p,[qIdx]:oIdx}))}}>{String.fromCharCode(65+oIdx)}. {opt}{submitted&&oIdx===q.answer&&" ✓"}{submitted&&oIdx===selections[qIdx]&&selections[qIdx]!==q.answer&&" ✗"}</button>; })}{submitted && <p className="text-xs px-3 py-2 rounded-lg bg-blue-50 text-blue-700">💬 {q.explanation}</p>}</div>))}
      </div>
      <div className="px-5 pb-5">
        {!submitted ? <button onClick={handleSubmit} disabled={Object.keys(selections).length<3} className="w-full py-2.5 rounded-xl text-sm font-semibold bg-gradient-to-r from-indigo-600 to-violet-600 text-white disabled:opacity-40">Submit ({Object.keys(selections).length}/3)</button>
        : <div className="space-y-2"><div className={`text-center py-2 rounded-xl font-semibold text-sm ${score===3?"bg-emerald-100 text-emerald-700":score>=2?"bg-blue-100 text-blue-700":"bg-red-100 text-red-700"}`}>Score: {score}/3</div><div className="flex gap-2"><button onClick={()=>{setSelections({});setSubmitted(false);setScore(null);}} className="flex-1 py-2 rounded-xl text-xs font-semibold border border-slate-200 text-slate-600 hover:bg-slate-50">↺ Retry</button>{score<3&&<button onClick={()=>onEmailEscalate(quiz.topic,quiz.course)} className="flex-1 py-2 rounded-xl text-xs font-semibold bg-amber-50 border border-amber-200 text-amber-700">✉️ Ask Prof</button>}</div></div>}
      </div>
    </div>
  );
};

                  </button>
                  {selectedEmail === email.id && !isReplied && (
                    <div className="ml-4 mt-2 p-4 rounded-xl bg-slate-50 border border-slate-200 space-y-3">
                      <p className="text-xs text-slate-600 leading-relaxed">{email.preview}</p>

                          className="px-4 py-2 rounded-lg text-xs font-semibold bg-slate-200 text-slate-600 hover:bg-slate-300 transition-colors">Cancel</button>
                      </div>
                    </div>
                  )}
                </div>
              );
            })}
          </div>
        </div>
      </div>
    </div>
  );
};

// FACULTY — Announcements (Academic Only, No CCA)
// ═══════════════════════════════════════════════════════════════════════════════

const FacultyAnnouncementsPage = () => {
  const [announcements, setAnnouncements] = useState([
    { id: 1, title: "Midterm Results Released", date: "2026-08-08", audience: "CG1111A", content: "Midterm results are now available on StudySync. Please review your performance and reach out during office hours if you need help.", pinned: true },
    { id: 2, title: "Tutorial 4 Deadline Extended", date: "2026-08-05", audience: "CG1111A", content: "Due to feedback, Tutorial 4 deadline is extended by 3 days to 14 Aug.", pinned: false },
    { id: 3, title: "Lab Safety Briefing Required", date: "2026-08-02", audience: "CG1111A", content: "All students must complete the online lab safety briefing before Week 5 lab sessions.", pinned: false },
  ]);
  const [newTitle, setNewTitle] = useState("");
  const [newContent, setNewContent] = useState("");
  const [newAudience, setNewAudience] = useState("CG1111A");
  const [published, setPublished] = useState(false);

  const handlePublish = () => {
    if (!newTitle.trim() || !newContent.trim()) return;
    const newAnn = { id: Date.now(), title: newTitle, date: new Date().toISOString().split("T")[0], audience: newAudience, content: newContent, pinned: false };
    setAnnouncements(p => [newAnn, ...p]);
    setNewTitle("");
    setNewContent("");
    setPublished(true);
    setTimeout(() => setPublished(false), 3000);
  };

  return (
    <div className="max-w-5xl mx-auto space-y-6">
      {/* Compose Announcement */}
      <div className="bg-white rounded-2xl border border-slate-200 p-6 shadow-sm">
        <h2 className="text-sm font-bold text-slate-900 flex items-center gap-2 mb-4">📢 Post New Announcement</h2>
        <div className="space-y-3">
          <div className="grid grid-cols-1 md:grid-cols-3 gap-3">
            <div className="md:col-span-2">
              <label className="block text-xs font-medium text-slate-500 mb-1.5">Title</label>
              <input type="text" value={newTitle} onChange={e => setNewTitle(e.target.value)} placeholder="Announcement title..."
                className="w-full px-3 py-2.5 rounded-xl border border-slate-200 text-sm outline-none focus:border-teal-400" />
            </div>
            <div>
              <label className="block text-xs font-medium text-slate-500 mb-1.5">Audience</label>
              <select value={newAudience} onChange={e => setNewAudience(e.target.value)}
                className="w-full px-3 py-2.5 rounded-xl border border-slate-200 text-sm outline-none focus:border-teal-400 bg-white">
                <option value="CG1111A">CG1111A (All Students)</option>
                <option value="CG1111A-Tutorial">CG1111A (Tutorial Groups)</option>
                <option value="At-Risk">At-Risk Students Only</option>
              </select>
            </div>
          </div>
          <div>
            <label className="block text-xs font-medium text-slate-500 mb-1.5">Message</label>
            <textarea value={newContent} onChange={e => setNewContent(e.target.value)} placeholder="Write your announcement..." rows={4}
              className="w-full px-3 py-2.5 rounded-xl border border-slate-200 text-sm outline-none focus:border-teal-400 resize-none" />
          </div>
          <div className="flex items-center gap-3">
            <button onClick={handlePublish}
              className="px-5 py-2.5 rounded-xl text-sm font-semibold bg-gradient-to-r from-teal-600 to-emerald-600 text-white hover:opacity-90 shadow-sm transition-all">
              📤 Publish Announcement
            </button>
            {published && <span className="text-xs font-medium text-emerald-600 flex items-center gap-1">✓ Published successfully!</span>}
          </div>
        </div>
      </div>

      {/* Existing Announcements */}
      <div className="bg-white rounded-2xl border border-slate-200 p-6 shadow-sm">
        <h2 className="text-sm font-bold text-slate-900 flex items-center gap-2 mb-4">📋 Posted Announcements</h2>
        <div className="space-y-3">
          {announcements.map(ann => (
            <div key={ann.id} className={`p-4 rounded-xl border ${ann.pinned ? "border-amber-200 bg-amber-50/50" : "border-slate-100 bg-slate-50"}`}>
              <div className="flex items-start justify-between gap-3 mb-2">
                <div className="flex items-center gap-2">
                  {ann.pinned && <span className="text-amber-500 text-sm">📌</span>}
                  <h4 className="text-sm font-semibold text-slate-900">{ann.title}</h4>
                </div>
                <div className="flex items-center gap-2 flex-shrink-0">
                  <Badge color="blue">{ann.audience}</Badge>
                  <span className="text-xs text-slate-400">{new Date(ann.date).toLocaleDateString("en-GB", {day:"numeric",month:"short"})}</span>
                </div>
              </div>
              <p className="text-sm text-slate-600 leading-relaxed">{ann.content}</p>
            </div>
          ))}
        </div>
      </div>
    </div>
  );
};

// FACULTY — Chatbot Page (Interactive Assistant)
// ═══════════════════════════════════════════════════════════════════════════════

const FacultyChatbotPage = () => {
  const [messages, setMessages] = useState([
    { id: 1, role: "ai", text: "Hello Prof. Smith! 👋 I'm your **class analytics assistant**.\n\nI can help you with:\n• Class performance stats and trends\n• Identifying struggling students\n• Topic difficulty analysis\n• Student engagement insights\n\nAsk me anything about your CG1111A class!" },
  ]);
  const [input, setInput] = useState("");
  const [isTyping, setIsTyping] = useState(false);
  const endRef = useRef(null);
  useEffect(() => { endRef.current?.scrollIntoView({ behavior: "smooth" }); }, [messages]);

  const generateResponse = (query) => {
    const lower = query.toLowerCase();
    if (lower.includes("lowest") && lower.includes("quiz") || lower.includes("struggling topic")) {
      return `Based on quiz data for CG1111A:\n\n**Lowest scoring topics:**\n• State Machines (Ch3): 42% avg — 89 students below 50%\n• Moore vs Mealy (Ch3): 48% avg — 72 students below 50%\n• Next-State Tables (Ch3): 51% avg — 58 students below 50%\n• Multiplexer Design (Ch2): 58% avg — 45 students below 50%\n\n📌 Chapter 3 is clearly the biggest pain point. Consider scheduling a review session.`;
    }
    if (lower.includes("low engagement") || lower.includes("disengaged")) {
      const lowEng = STUDENT_ROSTER.filter(s => s.engagement === "low");
      return `**Students with Low Engagement (${lowEng.length} total):**\n\n${lowEng.map(s => `• **${s.name}** (${s.id}) — ${s.attendance}% attendance, ${s.quizAvg}% quiz avg`).join("\n")}\n\n⚠️ ${lowEng.filter(s => s.performance === "poor").length} of these also have poor grades — consider priority outreach.`;
    }
    if (lower.includes("class average") || lower.includes("overall performance")) {
      const avg = Math.round(STUDENT_ROSTER.reduce((s, r) => s + r.midterm, 0) / STUDENT_ROSTER.length);
      const passing = STUDENT_ROSTER.filter(s => s.midterm >= 50).length;
      return `**CG1111A Class Performance Summary:**\n\n• Class Average (Midterm): **${avg}%**\n• Students Passing (≥50%): **${passing}/${STUDENT_ROSTER.length}** (${Math.round(passing/STUDENT_ROSTER.length*100)}%)\n• High performers (≥80%): **${STUDENT_ROSTER.filter(s=>s.midterm>=80).length}**\n• At-risk (<50%): **${STUDENT_ROSTER.filter(s=>s.midterm<50).length}**\n\nThe class is performing slightly below target. Ch3 topics are pulling the average down.`;
    }
    if (lower.includes("top student") || lower.includes("best perform")) {
      const sorted = [...STUDENT_ROSTER].sort((a, b) => b.midterm - a.midterm).slice(0, 5);
      return `**Top 5 Performers in CG1111A:**\n\n${sorted.map((s, i) => `${i+1}. **${s.name}** — Midterm: ${s.midterm}%, Quiz: ${s.quizAvg}%, Attendance: ${s.attendance}%`).join("\n")}\n\nThese students could be paired as peer tutors for struggling classmates.`;
    }
    if (lower.includes("attendance")) {
      const avgAtt = Math.round(STUDENT_ROSTER.reduce((s, r) => s + r.attendance, 0) / STUDENT_ROSTER.length);
      const low = STUDENT_ROSTER.filter(s => s.attendance < 75);
      return `**Attendance Overview:**\n\n• Class average attendance: **${avgAtt}%**\n• Students below 75% attendance: **${low.length}**\n\n**Lowest attendance:**\n${low.sort((a,b)=>a.attendance-b.attendance).map(s => `• ${s.name}: ${s.attendance}%`).join("\n")}\n\nCorrelation: Low attendance strongly correlates with poor quiz scores in this class.`;
    }
    return `I can help with that! Here are some things I can tell you about your CG1111A class:\n\n• **Quiz/topic performance** — which topics students struggle with\n• **Student engagement** — who's disengaged or at-risk\n• **Class statistics** — averages, distributions, trends\n• **Individual students** — specific performance details\n\nTry asking: *"Which topics have the lowest quiz scores?"* or *"List students with low engagement"*`;
  };

  const handleSend = () => {
    const t = input.trim(); if (!t) return;
    setMessages(p => [...p, { id: Date.now(), role: "user", text: t }]);
    setInput("");
    setIsTyping(true);
    setTimeout(() => {
      setIsTyping(false);
      setMessages(p => [...p, { id: Date.now() + 1, role: "ai", text: generateResponse(t) }]);
    }, 1200);
  };

  const promptChips = [
    "Which topics have the lowest quiz scores?",
    "List students with low engagement",
    "What is the class average performance?",
    "Who are the top students?",
    "Show attendance statistics",
  ];

  return (
    <div className="max-w-3xl mx-auto h-full flex flex-col">
      <div className="flex-1 overflow-y-auto space-y-4 pb-4 scrollbar-thin">
        {messages.map(msg => (
          <div key={msg.id} className={`flex ${msg.role === "user" ? "justify-end" : "justify-start"}`}>
            {msg.role === "ai" ? (
              <div className="max-w-[85%] bg-white rounded-2xl rounded-tl-sm px-5 py-4 border border-slate-200 shadow-sm">
                <MarkdownText text={msg.text} />
              </div>
            ) : (
              <div className="max-w-[75%] bg-gradient-to-r from-teal-600 to-emerald-600 rounded-2xl rounded-tr-sm px-5 py-3 text-white">
                <p className="text-sm">{msg.text}</p>
              </div>
            )}
          </div>
        ))}
        {isTyping && (
          <div className="flex justify-start">
            <div className="bg-white rounded-2xl rounded-tl-sm px-5 py-4 border border-slate-200 shadow-sm flex gap-1.5">
              {[0, 150, 300].map(d => <span key={d} className="w-2 h-2 bg-teal-400 rounded-full pulse-dot" style={{ animationDelay: `${d}ms` }} />)}
            </div>
          </div>
        )}
        <div ref={endRef} />
      </div>

      {/* Prompt Chips */}
      <div className="flex flex-wrap gap-2 pb-3">
        {promptChips.map((chip, i) => (
          <button key={i} onClick={() => { setInput(chip); }}
            className="px-3 py-1.5 rounded-full bg-teal-50 border border-teal-200 text-xs font-medium text-teal-700 hover:bg-teal-100 hover:border-teal-300 transition-all">
            {chip}
          </button>
        ))}
      </div>

      {/* Chat Input */}
      <div className="flex items-end gap-2 bg-white rounded-2xl border border-slate-200 shadow-sm px-4 py-3">
        <textarea rows={1} value={input} onChange={e => setInput(e.target.value)}
          onKeyDown={e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); handleSend(); } }}
          placeholder="Ask about class performance, students, or topics..."
          className="flex-1 text-sm text-slate-700 resize-none outline-none bg-transparent placeholder-slate-400 max-h-20 py-0.5" />
        <button onClick={handleSend} disabled={!input.trim()}
          className="w-9 h-9 rounded-xl bg-gradient-to-br from-teal-600 to-emerald-600 text-white flex items-center justify-center disabled:opacity-30 flex-shrink-0">
          <svg className="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2.5}><path strokeLinecap="round" strokeLinejoin="round" d="M6 12L3.269 3.126A59.768 59.768 0 0121.485 12 59.77 59.77 0 013.269 20.876L5.999 12zm0 0h7.5" /></svg>
        </button>
      </div>
    </div>
  );
};



// ═══════════════════════════════════════════════════════════════════════════════
// STUDENT DASHBOARD (wraps all original student UI — unchanged)
// ═══════════════════════════════════════════════════════════════════════════════

const StudentDashboard = ({ onLogout }) => {
  const [activePage, setActivePage] = useState("dashboard");
  const [emailModal, setEmailModal] = useState(null);
  const [pdfModal, setPdfModal] = useState(null);
  const [weeklyModal, setWeeklyModal] = useState(false);
  const [selectedModule, setSelectedModule] = useState(null);
  const [moduleInitialTab, setModuleInitialTab] = useState(null);
  const [moduleHighlightChapter, setModuleHighlightChapter] = useState(null);
  const [selectedCCA, setSelectedCCA] = useState(null);

  const openEmail = (topic, course, professor) => setEmailModal({ topic, course, professor });
  const closeEmail = () => setEmailModal(null);
  const openPDF = (fileName, title, page) => setPdfModal({ fileName, title, initialPage: page || 1 });
  const closePDF = () => setPdfModal(null);

  const goToModule = (code, tab, chapter) => { setSelectedModule(code); setModuleInitialTab(tab || "tests"); setModuleHighlightChapter(chapter || null); setActivePage("module-detail"); };
  const goToWeakTopicNotes = (courseCode, chapterId) => goToModule(courseCode, "notes", chapterId);
  const handleQuizInChat = (topicId, topicName) => { if (window._studysyncQuizRequest) window._studysyncQuizRequest(topicId, topicName); };

  const goToCCA = (ccaId) => { setSelectedCCA(ccaId); setActivePage("cca-detail"); };

  const renderPage = () => {
    switch (activePage) {
      case "dashboard": return (
        <div className="grid grid-cols-1 xl:grid-cols-2 gap-5 max-w-5xl">
          <StudentProfileCard />
          <TasksCard />
          <TimetableCard onOpenWeekly={() => setWeeklyModal(true)} />
          <WeakTopicsCard onQuizRequest={handleQuizInChat} onEmailEscalate={openEmail} onViewNotes={goToWeakTopicNotes} />
        </div>
      );
      case "modules": return <ModulesPage onSelectModule={(code) => goToModule(code, "tests", null)} />;
      case "module-detail": return <ModuleDetailPage moduleCode={selectedModule} onBack={() => setActivePage("modules")} initialTab={moduleInitialTab} highlightChapter={moduleHighlightChapter} onEmailEscalate={openEmail} onOpenPDF={openPDF} />;
      case "quizzes": return <QuizzesPage onEmailEscalate={openEmail} />;
      case "ccas": return <CCAsPage onSelectCCA={goToCCA} />;
      case "cca-detail": return <CCADetailPage ccaId={selectedCCA} onBack={() => setActivePage("ccas")} />;
      case "support": return <SupportPage onEmailEscalate={openEmail} />;
      default: return null;
    }
  };


  const pageHeaders = {
    dashboard: { title: "Dashboard", subtitle: "Your learning overview at a glance" },
    modules: { title: "My Modules", subtitle: "Click a module to explore" },
    "module-detail": { title: selectedModule ? `${selectedModule}: ${MODULES[selectedModule]?.name || ""}` : "Module", subtitle: "Past tests, lecture notes & tutorials" },
    quizzes: { title: "Practice Quizzes", subtitle: "Test your knowledge on weak topics" },
    ccas: { title: "My CCAs", subtitle: "Co-curricular activities & clubs" },
    "cca-detail": { title: selectedCCA ? CCA_DATA[selectedCCA]?.name : "CCA", subtitle: "Announcements, schedule & contacts" },
    support: { title: "Faculty Support", subtitle: "Get help from your professors" },
  };

  return (
    <div className="h-screen flex bg-slate-50 overflow-hidden">
      <Sidebar activePage={activePage} setActivePage={(p) => { setActivePage(p); setSelectedModule(null); setModuleHighlightChapter(null); setSelectedCCA(null); }} />
      <div className="flex-1 flex flex-col overflow-hidden min-w-0">
        <MobileNav activePage={activePage} setActivePage={(p) => { setActivePage(p); setSelectedModule(null); setModuleHighlightChapter(null); setSelectedCCA(null); }} />
        <header className="bg-white border-b border-slate-200 px-6 py-3 flex items-center justify-between flex-shrink-0">
          <div><h1 className="text-base font-bold text-slate-900">{pageHeaders[activePage]?.title}</h1><p className="text-xs text-slate-400">{pageHeaders[activePage]?.subtitle}</p></div>
          <div className="flex items-center gap-3">
            <span className="text-xs text-slate-400 hidden sm:inline">Week 3, Mon · AY2025/26</span>
            <Badge color="violet">Student</Badge>
            <button onClick={onLogout} className="flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-slate-100 hover:bg-slate-200 text-xs font-medium text-slate-600 transition-colors">
              🔄 Switch Role
            </button>
          </div>
        </header>
        <div className="flex-1 flex overflow-hidden">
          <main className="flex-1 overflow-y-auto p-5 scrollbar-thin">{renderPage()}</main>
          <div className="w-[370px] xl:w-[400px] flex-shrink-0 p-3 pl-0 hidden md:flex"><div className="flex-1 h-full"><ChatPanel onEmailEscalate={openEmail} /></div></div>
        </div>
      </div>
      {emailModal && <EmailModal topic={emailModal.topic} course={emailModal.course} professor={emailModal.professor} onClose={closeEmail} />}
      {pdfModal && <PDFViewerModal fileName={pdfModal.fileName} title={pdfModal.title} initialPage={pdfModal.initialPage} totalPages={120} onClose={closePDF} />}
      {weeklyModal && <WeeklyTimetableModal onClose={() => setWeeklyModal(false)} />}
    </div>
  );
};



// ═══════════════════════════════════════════════════════════════════════════════
// MAIN APP — Role-Based Routing
// ═══════════════════════════════════════════════════════════════════════════════

const App = () => {
  const [userRole, setUserRole] = useState(null); // null | 'student' | 'faculty'

  const handleLogin = (role) => {
    setUserRole(role);
  };

  const handleLogout = () => {
    setUserRole(null);
  };

  // If no role selected, show login screen
  if (userRole === null) {
    return <LoginScreen onLogin={handleLogin} />;
  }

  // Render based on role
  if (userRole === "student") {
    return <StudentDashboard onLogout={handleLogout} />;
  }

  if (userRole === "faculty") {
    return <FacultyDashboard onLogout={handleLogout} />;
  }

  return null;
};

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
